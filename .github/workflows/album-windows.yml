# Builds the Windows installer of the album app (desktop/). Run it by hand from the Actions tab,
# or push a tag like album-v0.1.0. The installer appears under the run's Artifacts.
name: Album app (Windows installer)

on:
  workflow_dispatch:
  push:
    tags: ["album-v*"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: LW-Album-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
