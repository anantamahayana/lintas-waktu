# Builds the Windows installer of the album app (desktop/). Run it by hand from the Actions tab.
# The installer appears under the run's Artifacts.
# With "release" ticked (and the signing secrets set, see docs/DEPLOYMENT.md → "Aplikasi album"),
# it also publishes a GitHub Release with latest.json, which installed apps use to update themselves.
name: Album app (Windows installer)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Terbitkan sebagai pembaruan (GitHub Release) untuk aplikasi yang sudah terpasang"
        type: boolean
        default: false
      notes:
        description: "Catatan rilis singkat (satu poin per baris, boleh kosong)"
        type: string
        default: ""
  push:
    tags: ["album-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      LW_UPDATER_PUBKEY: ${{ secrets.LW_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm test
      - name: Build
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$LW_UPDATER_PUBKEY" ]; then
            echo "Signed build: installed apps can update to this version."
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::Unsigned build (secrets LW_UPDATER_PUBKEY / TAURI_SIGNING_PRIVATE_KEY not set): this installer cannot update itself."
            npx tauri build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LW-Album-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish update (GitHub Release + latest.json)
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "::error::Set the signing secrets first (docs/DEPLOYMENT.md → Aplikasi album)."; exit 1; fi
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="album-v$VERSION"
          cd src-tauri/target/release/bundle/nsis
          EXE=$(ls *.exe | head -1)
          NAME="LW-Album_${VERSION}_x64-setup.exe"
          mv "$EXE" "$NAME"; mv "$EXE.sig" "$NAME.sig"
          BODY="${NOTES:-Lihat docs/CHANGELOG.md}"
          node -e '
            const fs = require("fs");
            const [v, name, tag, notes] = process.argv.slice(1);
            const url = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/${name}`;
            fs.writeFileSync("latest.json", JSON.stringify({ version: v, notes, pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature: fs.readFileSync(name + ".sig", "utf8").trim(), url } } }, null, 2));
          ' "$VERSION" "$NAME" "$TAG" "$BODY"
          gh release create "$TAG" "$NAME" "$NAME.sig" latest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "LW Album $VERSION" --notes "$BODY"
