<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: M; src: url(fonts/montserrat-500.woff2) format("woff2"); font-weight: 500; }
html,body { margin:0; background:#000; overflow:hidden; }
svg { display:block; }
</style></head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop id="k0" offset="0" stop-color="#2D3444"/>
      <stop id="k1" offset="0.55" stop-color="#5B5868"/>
      <stop id="k2" offset="1" stop-color="#B98B6C"/>
    </linearGradient>
    <radialGradient id="glowG">
      <stop offset="0" stop-color="#E9A54E" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#D9913A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C8832F" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="horizon"><rect x="40" y="0" width="120" height="116"/></clipPath>
    <linearGradient id="wipe" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1030" y2="0">
      <stop id="w0" offset="0" stop-color="#fff"/>
      <stop id="w1" offset="0" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="wordMask" maskUnits="userSpaceOnUse" x="-20" y="-20" width="1080" height="120">
      <rect x="-20" y="-20" width="1080" height="120" fill="url(#wipe)"/>
    </mask>
  </defs>
  <rect width="100%" height="100%" fill="url(#sky)"/>
  <g id="logo">
    <g id="mark">
      <path id="gate" fill="#1F1E1C" fill-rule="evenodd" d="__GATE__"/>
      <g id="glow" opacity="0"><circle cx="100" cy="92" r="13" fill="url(#glowG)" id="glowC"/></g>
      <g clip-path="url(#horizon)"><circle id="sun" cx="100" cy="92" r="13" fill="#C8832F"/></g>
    </g>
    <g id="word"><path fill="#1F1E1C" mask="url(#wordMask)" d="__WORD__"/></g>
    <text id="desc" text-anchor="middle" font-family="M" font-weight="500" fill="#77756F" opacity="0">PHOTOGRAPHY &amp; FILM · BALI</text>
  </g>
</svg>
<script>
const W = +new URLSearchParams(location.search).get("w") || 1080;
const H = +new URLSearchParams(location.search).get("h") || 1920;
const DUR = 3.2;
const $ = (id) => document.getElementById(id);
const s = $("s"); s.setAttribute("width", W); s.setAttribute("height", H); s.setAttribute("viewBox", `0 0 ${W} ${H}`);

// Layout: stacked logo, centred, sized from the short side.
const short = Math.min(W, H);
const gateH = short * 0.36;               // gate height in px
const k = gateH / 140;                    // mark units -> px
const wordW = gateH * 1.55, wordH = wordW * 73 / 1030.4;
const gap1 = gateH * 0.24, gap2 = wordH * 1.25, descSize = Math.max(14, wordH * 0.5);
const total = gateH + gap1 + wordH + gap2 + descSize;
const y0 = (H - total) / 2 - H * 0.02;
$("mark").setAttribute("transform", `translate(${W / 2 - 100 * k} ${y0 - 40 * k}) scale(${k})`);
$("word").setAttribute("transform", `translate(${(W - wordW) / 2} ${y0 + gateH + gap1}) scale(${wordW / 1030.4})`);
const desc = $("desc");
desc.setAttribute("x", W / 2); desc.setAttribute("font-size", descSize); desc.setAttribute("letter-spacing", descSize * 0.32);
const descY = y0 + gateH + gap1 + wordH + gap2 + descSize * 0.85;

const clamp = (x) => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const io = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const out = (x) => 1 - Math.pow(1 - x, 3);
const outBack = (x) => { const c = 1.25; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

const DUSK = ["#2D3444", "#5B5868", "#B98B6C"], GOLDEN = ["#C99A73", "#E2B488", "#F0CB9C"], PAPER = "#F3EFE7";
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (p, q, x) => { const A = hex(p), B = hex(q); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * x).toString(16).padStart(2, "0")).join(""); };
window.render = (t) => {
  // 1. sky: dusk -> golden hour -> paper
  const a = io(seg(t, 0.1, 1.05)), c = io(seg(t, 1.05, 2.0));
  ["k0", "k1", "k2"].forEach((id, i) => $(id).setAttribute("stop-color", mix(mix(DUSK[i], GOLDEN[i], a), PAPER, c)));
  // gate eases in from the dusk
  const g = out(seg(t, 0, 0.45));
  $("gate").setAttribute("opacity", g);
  // 2. sun rises from where the path meets the horizon
  const r = outBack(seg(t, 0.3, 1.45));
  $("sun").setAttribute("cy", 92 + 37 * (1 - r));
  // 3. one breath of light
  const b = seg(t, 1.05, 2.15), bell = Math.sin(Math.PI * b);
  $("glow").setAttribute("opacity", 0.6 * bell);
  $("glowC").setAttribute("r", 13 + 30 * out(b));
  // 4. wordmark written left to right, soft edge
  const w = io(seg(t, 1.3, 2.25)) * 1.25;
  $("w0").setAttribute("offset", Math.max(0, w - 0.25)); $("w1").setAttribute("offset", Math.min(1, w));
  if (w >= 1.25) { $("w0").setAttribute("offset", 1); $("w1").setAttribute("offset", 1); $("w1").setAttribute("stop-opacity", 1); }
  else $("w1").setAttribute("stop-opacity", 0);
  // 5. descriptor
  const d = out(seg(t, 1.85, 2.55));
  desc.setAttribute("opacity", d); desc.setAttribute("y", descY + (1 - d) * descSize * 0.6);
};
window.DUR = DUR;
document.fonts.ready.then(() => { render(+new URLSearchParams(location.search).get("t") || 0); window.ready = true; });
</script>
</body></html>
